<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c20">
  <title>三本木市のめっちゃ変幻自在</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px 40px;
      background: #f0f2ed;
      color: #172017;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    main { width: min(100%, 560px); margin: 0 auto; }
    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: clamp(1.25rem, 5vw, 1.8rem);
      line-height: 1.35;
      letter-spacing: .02em;
    }
    .card-stage { position: relative; width: 100%; line-height: 0; }
    .card-image { display: block; width: 100%; height: auto; }
    .controls {
      position: absolute;
      left: 7.2%;
      top: 65.2%;
      width: 85.6%;
      height: 30.3%;
      padding: clamp(12px, 3.5vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: clamp(10px, 2.8vw, 18px);
      line-height: 1.4;
      color: #182218;
    }
    .control-label { display: block; font-weight: 750; font-size: clamp(1rem, 4vw, 1.25rem); }
    .value-row { display: grid; grid-template-columns: minmax(0, 1fr) 86px; align-items: center; gap: 12px; }
    input[type="range"] { width: 100%; accent-color: #286438; cursor: pointer; }
    input[type="number"] {
      width: 100%; min-width: 0; padding: 8px 6px; border: 2px solid #789078;
      border-radius: 8px; background: #fff; color: #182218; font: inherit; font-weight: 700;
      text-align: center;
    }
    button {
      border: 2px solid #173c20; border-radius: 10px; padding: 12px 14px;
      background: #245b31; color: white; font: inherit; font-weight: 750;
      cursor: pointer; box-shadow: 0 3px 0 #15381e;
    }
    button:hover { background: #307340; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #15381e; }
    .hint { margin: 0; font-size: .82rem; color: #465246; text-align: center; }
    @media (max-width: 380px) {
      body { padding: 16px 8px 28px; }
      .controls { gap: 8px; padding: 8px; }
      .value-row { grid-template-columns: minmax(0, 1fr) 66px; gap: 8px; }
      button { padding: 9px 8px; }
      .hint { font-size: .72rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>三本木市のめっちゃ変幻自在</h1>
    <section class="card-stage" aria-label="三本木市のカード">
      <img class="card-image" src="image/card-image.jpeg" alt="三本木市のめっちゃ変幻自在のカード画像">
      <div class="controls">
        <label class="control-label" for="x-range">X = <output id="x-display">0</output></label>
        <div class="value-row">
          <input id="x-range" type="range" min="0" max="99" step="1" value="0" aria-label="Xのスライダー">
          <input id="x-number" type="number" min="0" max="99" step="1" value="0" inputmode="numeric" aria-label="Xの数値入力">
        </div>
        <button id="go-button" type="button">Scryfallでランダムカードを開く</button>
        <p class="hint">X の値に対応するマナ総量で検索します</p>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const slider = document.getElementById('x-range');
      const number = document.getElementById('x-number');
      const display = document.getElementById('x-display');
      const clampValue = value => Math.min(99, Math.max(0, Number.isFinite(value) ? Math.trunc(value) : 0));
      function setValue(value) {
        const x = clampValue(Number(value));
        slider.value = String(x);
        number.value = String(x);
        display.value = String(x);
        display.textContent = String(x);
      }
      slider.addEventListener('input', () => setValue(slider.value));
      number.addEventListener('input', () => {
        if (number.value === '') return;
        setValue(number.value);
      });
      number.addEventListener('change', () => setValue(number.value));
      document.getElementById('go-button').addEventListener('click', () => {
        const x = clampValue(Number(number.value));
        const url = `https://scryfall.com/random/?q=s:blb%20cmc:${x}`;
        window.location.href = url;
      });
      setValue(0);
    })();
  </script>
</body>
</html>
